# PostgreSQL (set DB_PASSWORD locally; do not commit credentials)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}

springdoc.swagger-ui.path=/swagger-ui.html
